<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingsu Lover - ສັ່ງອາຫານ</title>
    
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1DUy6y4NfvVQ99p1FNEvByRjY_66tGBkB">
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1DUy6y4NfvVQ99p1FNEvByRjY_66tGBkB">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans pb-28">
    <header class="bg-pink-500 text-white p-3.5 shadow-md sticky top-0 z-10 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img src="https://lh3.googleusercontent.com/d/1DUy6y4NfvVQ99p1FNEvByRjY_66tGBkB" alt="ໂລໂກ້" class="w-10 h-10 rounded-full object-cover border-white shadow">
            <div>
                <h1 class="text-base font-bold leading-tight">Bingsu Lover</h1>
                <p class="text-xs text-pink-100">ໂຕະ: <span id="table-number" class="font-semibold">01</span></p>
            </div>
        </div>
    </header>

    <main id="menu-container" class="p-4 max-w-md mx-auto space-y-6"></main>

    <!-- Option Modal -->
    <div id="optionModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 id="modalTitle" class="font-bold text-lg text-gray-800"></h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="font-bold text-gray-700 block mb-2">ເລືອກທັອບປິ້ງເພີ່ມ</label>
                    <div id="topping-list" class="space-y-2"></div>
                </div>
            </div>
            <div class="mt-6 pt-4 border-t flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500">ລາຄາລວມ</p>
                    <p id="modalPrice" class="font-bold text-lg text-pink-600">0 ₭</p>
                </div>
                <button onclick="addToCartModal()" class="bg-pink-500 text-white px-6 py-2.5 rounded-xl font-bold shadow hover:bg-pink-600">ເພີ່ມໃສ່ກະຕ່າ</button>
            </div>
        </div>
    </div>

    <!-- Confirm Cart Modal -->
    <div id="confirmCartModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-5 max-h-[90vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
                <h2 class="font-bold text-base text-gray-800">🛒 ກວດສອບລາຍການ ແລະ ຊໍາລະເງິນ</h2>
                <button onclick="closeConfirmCartModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            
            <div id="confirm-cart-items" class="space-y-3 overflow-y-auto flex-1 pr-1 max-h-[40vh]"></div>

            <div class="mt-3 pt-3 border-t space-y-3">
                <div>
                    <label class="font-bold text-gray-700 text-xs block mb-1.5">💳 ເລືອກປະເພດການຊໍາລະເງິນ:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="border-2 rounded-xl p-2.5 flex items-center justify-center space-x-2 cursor-pointer transition border-pink-500 bg-pink-50" id="label-cash">
                            <input type="radio" name="payment-method" value="เงินสด (Cash)" checked onchange="setPaymentMethod('cash')" class="accent-pink-500">
                            <span class="text-xs font-bold text-gray-800">💵 ເງິນສົດ</span>
                        </label>
                        <label class="border-2 rounded-xl p-2.5 flex items-center justify-center space-x-2 cursor-pointer transition border-gray-200 bg-white" id="label-transfer">
                            <input type="radio" name="payment-method" value="เงินโอน (Transfer)" onchange="setPaymentMethod('transfer')" class="accent-pink-500">
                            <span class="text-xs font-bold text-gray-800">📱 ໂອນຈ່າຍ</span>
                        </label>
                    </div>
                </div>

                <div class="flex justify-between items-center font-bold text-base pt-1">
                    <span class="text-gray-700">ລວມຍອດທັງໝົດ:</span>
                    <span id="confirm-cart-total" class="text-pink-600 text-lg">0 ₭</span>
                </div>
                
                <button id="checkoutBtn" onclick="submitOrder()" class="w-full bg-pink-500 hover:bg-pink-600 text-white py-3 rounded-xl font-bold shadow text-sm transition">
                    ຢືນຢັນສັ່ງອາຫານ ແລະ ບັນທຶກໃບບິນ 🚀
                </button>
            </div>
        </div>
    </div>

    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-between items-center max-w-md mx-auto shadow-lg hidden z-30">
        <div>
            <p class="text-xs text-gray-500"><span id="cartCount">0</span> ລາຍການໃນກະຕ່າ</p>
            <p id="cartTotal" class="font-bold text-lg text-gray-800">0 ₭</p>
        </div>
        <button onclick="openConfirmCartModal()" class="bg-pink-500 hover:bg-pink-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow transition">
            🛒 ตรวจสอบตะกร้า
        </button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3X6oG8MuCJytbXxekcg-zDNfQTBf23MMPA5G-rG3oBEUF_ccsOLj-txrS0ZvJP9bpcQ/exec";

        const menuData = [
            {
                category: "🍧 ເມນູບິງຊູ (ເລືອກທັອບປິ້ງໄດ້)",
                items: [
                    { id: 1, name: "ບິງຊູຊັອກໂກ້ບຣາວນີ້", price: 89000, img: "https://lh3.googleusercontent.com/d/1_8Zyo4aM9PHvznOlm3EyKcIAr4oZeaMJ", hasOption: true, available: true },
                    { id: 2, name: "ບິງຊູໝາກມ່ວງ", price: 89000, img: "https://lh3.googleusercontent.com/d/1O-gpnZxkyIivrvqYdC2s1kFHo2HIG-Qk", hasOption: true, available: true },
                    { id: 3, name: "ບິງຊູຊາໄທ", price: 89000, img: "https://lh3.googleusercontent.com/d/1_Yq53PXcHCdv3CboFQYNODLZYk56QZsh", hasOption: true, available: true },
                    { id: 4, name: "ບິງຊູຂຽວຊັອກຊິບ", price: 89000, img: "https://lh3.googleusercontent.com/d/1Xtw0CzQPcptSKduOOiIh6U5HjQLhMZ-_", hasOption: true, available: true },
                    { id: 5, name: "ບິງຊູຊັອກໂກ້ບານານາ", price: 89000, img: "https://lh3.googleusercontent.com/d/1pWLPKt43sW65l_yAWyyRHdSTqsa-44CY", hasOption: true, available: true },
                    { id: 6, name: "ບິງຊູຊາຂຽວ ບຣາວນີ້", price: 89000, img: "https://lh3.googleusercontent.com/d/1B2HS7EbmyaINLoL5UNcCJ9v7N_u6crIY", hasOption: true, available: true },
                    { id: 7, name: "ບິງຊູບານານ່າພູເຂົາໄຟ", price: 89000, img: "https://lh3.googleusercontent.com/d/1ah81YOGhiyt5go50OLl2Ll9-Drba2DYP", hasOption: true, available: true },
                    { id: 8, name: "ບິງຊູຄອນເຟັກໂກໂກ້ຄັ້ນ", price: 89000, img: "https://lh3.googleusercontent.com/d/1Yxss5ZOBmUzkcHjHPzLnekmfmFyWqCch", hasOption: true, available: true },
                    { id: 9, name: "ບິງຊູໝາກໂມ", price: 119000, img: "https://lh3.googleusercontent.com/d/14-UUzC9FYDcxA7zIcpvLBSn0qRs9unMj", hasOption: true, available: true },
                    { id: 10, name: "ບິງຊູເມລ່ອນ", price: 119000, img: "https://lh3.googleusercontent.com/d/1-2YG1JZ4d87l3jMVs_hmMGLl5OqXbapA", hasOption: true, available: true },
                    { id: 11, name: "ບິງຊູແຄນຕາລຸບ", price: 119000, img: "https://lh3.googleusercontent.com/d/1cwsGq7hnxNuPAWBLl7XFowVrt-PAw7hp", hasOption: true, available: true }
                ]
            },
            {
                category: "🍟 ເມນູຂອງກິນຫຼິ້ນ",
                items: [
                    { id: 101, name: "ເຟນຟາຍ", price: 30000, img: "https://lh3.googleusercontent.com/d/1I-n3U1-g0HgprEACsLX1n1QyaYNH7Md8", hasOption: false, available: false },
                    { id: 102, name: "ຂາໄກ່ທອດ", price: 30000, img: "https://lh3.googleusercontent.com/d/1NCdiE8AyJC6CDZeS65SLcK-Q-4up4Y8r", hasOption: false, available: false },
                    { id: 103, name: "ປີກໄກ່ທອດ", price: 30000, img: "https://lh3.googleusercontent.com/d/1Jd5OeMOYwQCbd82ue3_iwGrzKBajW_BD", hasOption: false, available: false },
                    { id: 104, name: "ລູກຊີ້ນຮ໋ອດດັອກທອດ", price: 35000, img: "https://lh3.googleusercontent.com/d/1OvXbp8A4iOkFPqPH5xpsl-3rzZe9XQrG", hasOption: false, available: false },
                    { id: 105, name: "ມາມາເກົາຫຼີ", price: 40000, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTc9VT6Aai2Y_jBr6PQl4S_-yU05xFBIoGHOfBDC5TB0TNbIlTwoEcQN6fd&s=10", hasOption: false, available: true }
                ]
            },
            {
                category: "🧋 ເມນູນ້ຳ",
                items: [
                    { id: 201, name: "ນ້ໍາດື່ມ", price: 5000, img: "https://lh3.googleusercontent.com/d/1BMcR1eu786RwuwU2tWlGXuL6fu3LBKZw", hasOption: false, available: true },
                    { id: 202, name: "ໂກໂກ້", price: 29000, img: "https://lh3.googleusercontent.com/d/17FnDviArIALaHK05MYFPAQG2YeUVeaOl", hasOption: false, available: true },
                    { id: 203, name: "ຊາໄທ", price: 29000, img: "https://lh3.googleusercontent.com/d/1TnCO03twPtffmjV6kfb4NQtIZSLV68Eo", hasOption: false, available: true },
                    { id: 204, name: "ຊາຂຽວ", price: 29000, img: "https://lh3.googleusercontent.com/d/1_taSrZzof01KP3f647Wci9J7zJLrm8QJ", hasOption: false, available: true },
                    { id: 205, name: "ນົມສົດ", price: 29000, img: "https://lh3.googleusercontent.com/d/1dTMrBsfYyaJyHr2UknpgSTBsgbOzsgHq", hasOption: false, available: true },
                    { id: 206, name: "ແປັບຊີ້", price: 15000, img: "https://lh3.googleusercontent.com/d/1P6_6P2rSD900hom2ZdmLgYB-s8Ay9FwA", hasOption: false, available: true }
                ]
            }
        ];

        const toppingsData = [
            { name: "ຊອດຊັອກໂກແລັດ", price: 5000 },
            { name: "ນົມຂົ້ນຫວານ", price: 5000 },
            { name: "ຊອດຊາໄທ", price: 5000 },
            { name: "ຊອດຊາຂຽວ", price: 5000 },
            { name: "ຄອນເຟຼກ", price: 7000 },
            { name: "ໂກໂກ້ຄຣັ້ນ", price: 7000 },
            { name: "ຂະໜົມປັງກິ່ງ", price: 7000 },
            { name: "ຂະໜົມປັງ", price: 7000 },
            { name: "ເມັດບຸກ", price: 7000 },
            { name: "ບຣາວນີ້", price: 10000 },
            { name: "ວິປຄຣີມ", price: 10000 }
        ];

        let cart = [];
        let itemQuantities = {};
        let selectedPayment = "เงินสด (Cash)";
        const urlParams = new URLSearchParams(window.location.search);
        const tableNumber = urlParams.get('table') || '01';
        let currentItem = null;
        document.getElementById('table-number').innerText = tableNumber;

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            menuData.forEach(group => {
                let groupHTML = `<div class="space-y-3"><h2 class="font-bold text-gray-700 border-b pb-1 text-base">${group.category}</h2>`;
                group.items.forEach(item => {
                    if (itemQuantities[item.id] === undefined) itemQuantities[item.id] = 1;
                    let qty = itemQuantities[item.id];
                    let isAvailable = item.available !== false;

                    let actionButton = isAvailable 
                        ? `<div class="flex items-center justify-between mt-2">
                                <div class="flex items-center border rounded-lg bg-gray-50 overflow-hidden">
                                    <button onclick="changeQty(${item.id}, -1)" class="px-2 py-0.5 text-gray-600 hover:bg-gray-200 font-bold text-xs">-</button>
                                    <span id="qty-${item.id}" class="px-2.5 text-xs font-bold text-gray-800">${qty}</span>
                                    <button onclick="changeQty(${item.id}, 1)" class="px-2 py-0.5 text-gray-600 hover:bg-gray-200 font-bold text-xs">+</button>
                                </div>
                                <button onclick="handleItemClick(${item.id})" class="${item.hasOption ? 'bg-pink-100 text-pink-600 hover:bg-pink-200' : 'bg-pink-500 text-white hover:bg-pink-600'} px-3 py-1 rounded-lg font-bold text-xs transition">
                                    ${item.hasOption ? 'ເລືອກ' : 'ສັ່ງ'}
                                </button>
                           </div>`
                        : `<div class="mt-2"><span class="bg-gray-200 text-gray-500 px-3 py-1 rounded-lg font-bold text-xs">❌ สินค้าหมด (Sold Out)</span></div>`;

                    groupHTML += `
                        <div class="bg-white p-3 rounded-xl shadow-sm flex items-center space-x-3 ${!isAvailable ? 'opacity-60' : ''}">
                            <img src="${item.img}" alt="${item.name}" class="w-20 h-20 min-w-[5rem] object-cover rounded-xl shadow-sm">
                            <div class="flex-1">
                                <h3 class="font-bold text-gray-800 text-sm leading-snug">${item.name}</h3>
                                <p class="text-pink-600 font-bold mt-0.5 text-sm">${item.price.toLocaleString()} ₭</p>
                                ${actionButton}
                            </div>
                        </div>
                    `;
                });
                groupHTML += `</div>`;
                container.innerHTML += groupHTML;
            });
        }

        function changeQty(id, delta) {
            if (itemQuantities[id] + delta >= 1) {
                itemQuantities[id] += delta;
                document.getElementById(`qty-${id}`).innerText = itemQuantities[id];
            }
        }

        function handleItemClick(id) {
            let foundItem = null;
            menuData.forEach(g => {
                let match = g.items.find(i => i.id === id);
                if (match) foundItem = match;
            });
            if (!foundItem || foundItem.available === false) return;

            let qty = itemQuantities[id] || 1;
            if (foundItem.hasOption) {
                openModal(foundItem, qty);
            } else {
                addToCartDirect(foundItem.name, foundItem.price, qty);
                itemQuantities[id] = 1;
                document.getElementById(`qty-${id}`).innerText = 1;
            }
        }

        function openModal(item, qty) {
            currentItem = { ...item, qty: qty };
            document.getElementById('modalTitle').innerText = `${item.name} (x${qty})`;
            const toppingContainer = document.getElementById('topping-list');
            toppingContainer.innerHTML = '';
            toppingsData.forEach((top) => {
                toppingContainer.innerHTML += `
                    <label class="flex items-center justify-between border p-2 rounded-lg cursor-pointer">
                        <span>${top.name} (+${top.price.toLocaleString()} ₭)</span>
                        <input type="checkbox" value="${top.name}" data-price="${top.price}" class="topping-checkbox accent-pink-500 w-4 h-4" onchange="updateModalPrice()">
                    </label>
                `;
            });
            updateModalPrice();
            document.getElementById('optionModal').classList.remove('hidden');
        }

        function updateModalPrice() {
            let toppingTotal = 0;
            document.querySelectorAll('.topping-checkbox:checked').forEach(el => {
                toppingTotal += parseInt(el.getAttribute('data-price')) || 0;
            });
            let total = (currentItem.price + toppingTotal) * currentItem.qty;
            document.getElementById('modalPrice').innerText = total.toLocaleString() + ' ₭';
            currentItem.currentPricePerUnit = currentItem.price + toppingTotal;
        }

        function closeModal() { document.getElementById('optionModal').classList.add('hidden'); }

        function addToCartModal() {
            const toppings = Array.from(document.querySelectorAll('.topping-checkbox:checked')).map(el => ({
                name: el.value, price: parseInt(el.getAttribute('data-price'))
            }));
            
            for (let i = 0; i < currentItem.qty; i++) {
                cart.push({ name: currentItem.name, price: currentItem.currentPricePerUnit, toppings: toppings });
            }

            itemQuantities[currentItem.id] = 1;
            document.getElementById(`qty-${currentItem.id}`).innerText = 1;

            updateCartUI();
            closeModal();
        }

        function addToCartDirect(name, price, qty) {
            for (let i = 0; i < qty; i++) {
                cart.push({ name: name, price: price, toppings: [] });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            if (cart.length > 0) {
                cartBar.classList.remove('hidden');
                cartCount.innerText = cart.length;
                let total = cart.reduce((sum, item) => sum + item.price, 0);
                cartTotal.innerText = total.toLocaleString() + ' ₭';
            } else { cartBar.classList.add('hidden'); }
        }

        function setPaymentMethod(method) {
            selectedPayment = method === 'cash' ? 'เงินสด (Cash)' : 'เงินโอน (Transfer)';
            if (method === 'cash') {
                document.getElementById('label-cash').className = "border-2 rounded-xl p-2.5 flex items-center justify-center space-x-2 cursor-pointer transition border-pink-500 bg-pink-50";
                document.getElementById('label-transfer').className = "border-2 rounded-xl p-2.5 flex items-center justify-center space-x-2 cursor-pointer transition border-gray-200 bg-white";
            } else {
                document.getElementById('label-transfer').className = "border-2 rounded-xl p-2.5 flex items-center justify-center space-x-2 cursor-pointer transition border-pink-500 bg-pink-50";
                document.getElementById('label-cash').className = "border-2 rounded-xl p-2.5 flex items-center justify-center space-x-2 cursor-pointer transition border-gray-200 bg-white";
            }
        }

        function openConfirmCartModal() {
            const container = document.getElementById('confirm-cart-items');
            container.innerHTML = '';
            let grandTotal = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-4 text-sm">ບໍ່ມີລາຍການໃນກະຕ່າ</p>`;
                document.getElementById('confirm-cart-total').innerText = '0 ₭';
                return;
            }

            cart.forEach((item, index) => {
                grandTotal += item.price;
                let toppingsText = item.toppings && item.toppings.length > 0 
                    ? `<div class="text-gray-500 text-[11px]">+ ${item.toppings.map(t => t.name).join(', ')}</div>` 
                    : '';

                container.innerHTML += `
                    <div class="bg-gray-50 p-3 rounded-2xl flex justify-between items-center border border-gray-100">
                        <div class="space-y-0.5 flex-1 pr-2">
                            <p class="font-bold text-gray-800 text-xs">${index + 1}. ${item.name}</p>
                            ${toppingsText}
                            <p class="text-xs text-pink-600 font-bold">${item.price.toLocaleString()} ₭</p>
                        </div>
                        <button onclick="removeCartItem(${index})" class="bg-red-50 hover:bg-red-100 text-red-500 w-8 h-8 rounded-xl font-bold text-xs flex items-center justify-center transition shrink-0" title="ລຶບລາຍການນີ້">
                            🗑️
                        </button>
                    </div>
                `;
            });

            document.getElementById('confirm-cart-total').innerText = grandTotal.toLocaleString() + ' ₭';
            document.getElementById('confirmCartModal').classList.remove('hidden');
        }

        function closeConfirmCartModal() {
            document.getElementById('confirmCartModal').classList.add('hidden');
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            updateCartUI();
            openConfirmCartModal();
            if (cart.length === 0) {
                closeConfirmCartModal();
            }
        }

        function getGroupedOrders(orders) {
            let map = {};
            orders.forEach(item => {
                let toppingsKey = item.toppings ? item.toppings.map(t => t.name).sort().join(',') : '';
                let key = item.name + '|' + item.price + '|' + toppingsKey;
                if (map[key]) map[key].qty += 1;
                else map[key] = { name: item.name, price: item.price, toppings: item.toppings, qty: 1 };
            });
            return Object.values(map);
        }

        function generateAndSaveSlip(orderItems, grandTotalVal, nowString) {
            let grouped = getGroupedOrders(orderItems);
            let dynamicItemsHeight = 0;
            grouped.forEach(item => {
                dynamicItemsHeight += 30;
                if (item.toppings && item.toppings.length > 0) dynamicItemsHeight += 22;
                dynamicItemsHeight += 8;
            });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 320 + dynamicItemsHeight + 120;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            function drawRoundedRect(x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }

            ctx.save();
            drawRoundedRect(0, 0, canvas.width, canvas.height, 24);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.clip();

            const logoImg = new Image();
            logoImg.crossOrigin = "anonymous";
            logoImg.src = "https://lh3.googleusercontent.com/d/1DUy6y4NfvVQ99p1FNEvByRjY_66tGBkB";
            
            logoImg.onload = function() {
                ctx.save();
                ctx.globalAlpha = 0.06;
                ctx.drawImage(logoImg, canvas.width / 2 - 150, canvas.height / 2 - 150, 300, 300);
                ctx.restore();
                drawSlipBody(canvas, ctx, grouped, grandTotalVal, nowString);
            };

            logoImg.onerror = function() {
                drawSlipBody(canvas, ctx, grouped, grandTotalVal, nowString);
            };
        }

        function drawSlipBody(canvas, ctx, grouped, grandTotalVal, nowString) {
            ctx.fillStyle = '#ec4899';
            ctx.fillRect(0, 0, canvas.width, 130);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('BINGSU LOVER', canvas.width / 2, 55);

            ctx.font = '15px sans-serif';
            ctx.fillText('ໃບເກັບເງິນ / Receipt Slip', canvas.width / 2, 92);

            ctx.fillStyle = '#374151';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('ໂຕະ (Table): ' + tableNumber, 40, 175);

            ctx.font = '14px sans-serif';
            ctx.fillStyle = '#6b7280';
            ctx.fillText('ວັນທີ: ' + nowString, 40, 200);
            ctx.fillText('ຊຳລະຜ່ານ: ' + selectedPayment, 40, 225);

            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(40, 245);
            ctx.lineTo(560, 245);
            ctx.stroke();

            let y = 290;
            grouped.forEach((item, index) => {
                ctx.fillStyle = '#1f2937';
                ctx.font = 'bold 17px sans-serif';
                ctx.textAlign = 'left';
                let displayName = `${index + 1}. ${item.name}` + (item.qty > 1 ? ` (x${item.qty})` : '');
                ctx.fillText(displayName, 40, y);

                ctx.textAlign = 'right';
                let totalItemPrice = item.price * item.qty;
                ctx.fillText(`${totalItemPrice.toLocaleString()} ₭`, 560, y);
                y += 28;

                if (item.toppings && item.toppings.length > 0) {
                    ctx.fillStyle = '#6b7280';
                    ctx.font = '13px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(`   + ${item.toppings.map(t => t.name).join(', ')}`, 40, y);
                    y += 22;
                }
                y += 8;
            });

            ctx.strokeStyle = '#e5e7eb';
            ctx.beginPath();
            ctx.moveTo(40, y);
            ctx.lineTo(560, y);
            ctx.stroke();
            y += 35;

            ctx.fillStyle = '#111827';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('ລວມຍອດທັງໝົດ (Total):', 40, y);

            ctx.fillStyle = '#ec4899';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`${grandTotalVal.toLocaleString()} ₭`, 560, y);

            y += 65;
            ctx.fillStyle = '#9ca3af';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ຂອບໃຈທີ່ໃຊ້ບໍລິການ Bingsu Lover!', canvas.width / 2, y);

            ctx.restore();

            let safeDateStr = nowString.replace(/[/:]/g, '-');
            let fileName = `ໃບບິນ Bingsu Lover (ໂຕະ ${tableNumber} - ${safeDateStr}).png`;

            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function submitOrder() {
            if (cart.length === 0) return;
            const btn = document.getElementById('checkoutBtn');
            const originalText = btn.innerText;
            btn.innerText = 'ກຳລັງສົ່ງອໍເດີ້...';
            btn.disabled = true;

            let currentOrderItems = [...cart];
            let grouped = getGroupedOrders(currentOrderItems);
            let roundTotal = currentOrderItems.reduce((sum, item) => sum + item.price, 0);

            const now = new Date();
            let dateStr = now.toISOString().split('T')[0];
            let timeStr = now.toTimeString().split(' ')[0];
            let nowString = now.toLocaleString();

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    "sheet": "Sheet1",
                    "Date": dateStr,
                    "Time": timeStr,
                    "Table": String(tableNumber),
                    "Items": JSON.stringify(grouped),
                    "Total": roundTotal,
                    "Payment": selectedPayment
                })
            }).catch(err => console.log("Apps Script Error:", err));

            let text = `--- 📋 ອໍເດີ້ໃໝ່ ໂຕະ ${tableNumber} ---\n`;
            grouped.forEach((item, index) => {
                text += `\n${index + 1}. ${item.name} (x${item.qty}) - ${(item.price * item.qty).toLocaleString()} ₭`;
                if (item.toppings && item.toppings.length > 0) {
                    text += `\n   + ທັອບປິ້ງ: ` + item.toppings.map(t => t.name).join(', ');
                }
            });
            text += `\n\n💳 ປະເພດຊຳລະ: ${selectedPayment}`;
            text += `\n💰 ລວມຍອດຮອບນີ້: ${roundTotal.toLocaleString()} ₭`;

            const apiKey = "LTU0NjIxODI3ODA"; 
            const telegramUrl = `https://api.callmebot.com/telegram/group.php?apikey=${apiKey}&text=${encodeURIComponent(text)}`;
            fetch(telegramUrl, { mode: 'no-cors' }).catch(e => console.error("Telegram Error", e));

            generateAndSaveSlip(currentOrderItems, roundTotal, nowString);

            setTimeout(() => {
                alert('ສົ່ງອໍເດີ້ສຳເລັດ ແລະ ບັນທຶກສະລິບລົງເຄື່ອງແລ້ວ!');
                cart = [];
                updateCartUI();
                closeConfirmCartModal();
                btn.innerText = originalText;
                btn.disabled = false;
            }, 1000);
        }

        renderMenu();
    </script>
</body>
